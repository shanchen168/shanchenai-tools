  @keyframes fade {
    0%     { opacity: 1; }
    19.7%  { opacity: 1; }
    25%    { opacity: 0; }
    94.7%  { opacity: 0; }
    100%   { opacity: 1; }
  }

  .panel-frame {
    position: absolute;
    top: 8%;
    bottom: 8%;
    left: 8%;
    right: 8%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glass {
    width: 100%;
    height: 100%;
    background: rgba(40,36,30,0.16);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 20px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      0 40px 90px rgba(10,8,6,0.4);
    padding: clamp(20px, 3vh, 40px) clamp(24px, 3.5vw, 48px);
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2.2vh, 24px);
  }

  .hero { flex-shrink: 0; }

  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 4.2vw, 52px);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
    margin: 0;
    text-shadow: 0 1px 20px rgba(255,255,255,0.35);
  }

  .wordmark .ai { color: var(--gold); }

  .rule {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .rule .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
  .rule .line { height: 1px; background: var(--ink); opacity: 0.25; flex-grow: 1; }

  .main {
    flex-grow: 1;
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    grid-template-rows: auto 1fr;
    column-gap: clamp(14px, 2vw, 26px);
    row-gap: 10px;
    min-height: 0;
  }

  /* left preview */
  .preview-bar {
    grid-column: 1;
    grid-row: 1;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .preview-frame {
    grid-column: 1;
    grid-row: 2;
    min-height: 0;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    position: relative;
  }

  .preview-scale {
    position: absolute;
    top: 0;
    left: 0;
    width: 1440px;
    height: 900px;
    transform-origin: top left;
  }

  .preview-scale iframe {
    width: 1440px;
    height: 900px;
    border: 0;
    display: block;
    pointer-events: none;
  }

  .preview-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: clamp(12px, 1vw, 14px);
    text-align: center;
    padding: 20px;
  }


    font-size: clamp(13px, 1.1vw, 16px);
    font-weight: 800;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .open-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: 'Nunito', sans-serif;
    font-size: clamp(11px, 0.95vw, 13px);
    font-weight: 600;
    padding: 4px 2px;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .open-btn::after {
    content: "↗";
    font-size: 0.95em;
  }
  .open-btn:hover { color: var(--gold); }
  .open-btn:disabled { opacity: 0.35; cursor: default; }

  /* right grid */
  .tools {
    grid-column: 2;
    grid-row: 2;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    --tgap: clamp(8px, 1.1vw, 14px);
    grid-template-rows: repeat(4, 1fr);
    grid-auto-rows: calc((100% - 3 * var(--tgap)) / 4);
    gap: var(--tgap);
    min-height: 0;
    min-width: 0;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .tools::-webkit-scrollbar { display: none; }

  .card {
    border-radius: 12px;
    padding: clamp(9px, 1.2vw, 15px);
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
    overflow: hidden;
    text-align: left;
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
  }

  .card.active {
    background: rgba(255,255,255,0.20);
    border: 1px solid rgba(216,182,133,0.6);
  }

  .card.tool {
    background: rgba(20,17,14,0.28);
    border: 1px solid rgba(255,255,255,0.14);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    color: inherit;
  }
  .card.tool:hover { background: rgba(20,17,14,0.4); border-color: rgba(255,255,255,0.28); transform: translateY(-2px); }
  .card.tool:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .card-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon { width: clamp(18px, 1.8vw, 24px); height: clamp(18px, 1.8vw, 24px); flex-shrink: 0; }

  .card h2 {
    font-size: clamp(11px, 1vw, 13.5px);
    font-weight: 700;
    margin: 0;
    line-height: 1.25;
    color: #FFFFFF;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }

  .card p {
    font-size: clamp(9.5px, 0.85vw, 11.5px);
    line-height: 1.45;
    color: rgba(255,255,255,0.75);
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .placeholder {
    border: 1px dashed rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.03);
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: clamp(9.5px, 0.85vw, 11.5px);
    font-weight: 600;
    text-align: center;
  }

  .icon { color: var(--ink); }
</style>
</head>
<body>

  <div class="stage">
    <div class="bg-slide s1"></div>
    <div class="bg-slide s2"></div>
    <div class="bg-slide s3"></div>
    <div class="bg-slide s4"></div>

    <div class="panel-frame">
      <div class="glass">

        <div class="hero">
          <h1 class="wordmark">ShanChen<span class="ai">.AI</span></h1>
          <div class="rule"><div class="dot"></div><div class="line"></div></div>
        </div>

        <div class="main">

          <div class="preview-bar">
            <span class="preview-title" id="previewTitle">請選擇右側工具</span>
            <button class="open-btn" id="openBtn" disabled>Start</button>
          </div>
          <div class="preview-frame" id="previewFrameWrap">
            <div class="preview-scale" id="previewScale">
              <iframe id="previewFrame" src="about:blank" tabindex="-1"></iframe>
            </div>
            <div class="preview-empty" id="previewEmpty">點選右側工具即可預覽</div>
          </div>

          <div class="tools" id="tools"></div>

        </div>

      </div>
    </div>
  </div>

<script>
  const BASE_W = 1440;
  const MIN_SLOTS = 8; // 右側至少顯示幾格(不足的補空格)

  /* ============================================================
     新增工具：複製下面任一行 { ... }，貼在「新工具貼在這一行上方」那行之上，
     再改 name / url / desc / icon 即可。
     icon 可用：doc、shield、calc、chart、calendar、list、home、ruler
     ============================================================ */
  const TOOLS = [
    { name: '面板訂購工具', url: 'https://panel-order-tool-phi.vercel.app/', desc: 'Panasonic水電面板依系列分組，統計品項製成訂購單。', icon: 'doc' },
    { name: '保護材料計算工具', url: 'https://protection-material.vercel.app/', desc: '計算保護材料數量，並提供師傅包法圖文說明。', icon: 'shield' },
    // 新工具貼在這一行上方
  ];

  const ICONS = {
    doc: '<rect x="8" y="4" width="26" height="34" rx="2"/><line x1="13" y1="12" x2="29" y2="12"/><line x1="13" y1="19" x2="29" y2="19"/><line x1="13" y1="26" x2="24" y2="26"/><circle cx="27" cy="26" r="2" fill="currentColor"/>',
    shield: '<path d="M21 4 L35 9 V20 C35 28 29 34 21 38 C13 34 7 28 7 20 V9 Z" stroke-linejoin="round"/><line x1="14" y1="19" x2="28" y2="19"/><line x1="14" y1="25" x2="24" y2="25"/>',
    calc: '<rect x="9" y="4" width="24" height="34" rx="2"/><rect x="14" y="9" width="14" height="7"/><circle cx="16" cy="23" r="1.2" fill="currentColor"/><circle cx="21" cy="23" r="1.2" fill="currentColor"/><circle cx="26" cy="23" r="1.2" fill="currentColor"/><circle cx="16" cy="29" r="1.2" fill="currentColor"/><circle cx="21" cy="29" r="1.2" fill="currentColor"/><circle cx="26" cy="29" r="1.2" fill="currentColor"/>',
    chart: '<line x1="7" y1="35" x2="35" y2="35"/><line x1="7" y1="35" x2="7" y2="7"/><rect x="12" y="22" width="5" height="13"/><rect x="20" y="14" width="5" height="21"/><rect x="28" y="18" width="5" height="17"/>',
    calendar: '<rect x="6" y="9" width="30" height="27" rx="2"/><line x1="6" y1="17" x2="36" y2="17"/><line x1="14" y1="5" x2="14" y2="12"/><line x1="28" y1="5" x2="28" y2="12"/><circle cx="14" cy="25" r="1.3" fill="currentColor"/><circle cx="21" cy="25" r="1.3" fill="currentColor"/><circle cx="28" cy="25" r="1.3" fill="currentColor"/>',
    list: '<rect x="8" y="5" width="26" height="32" rx="2"/><path d="M13 14 l2 2 l4 -4"/><line x1="23" y1="14" x2="29" y2="14"/><path d="M13 23 l2 2 l4 -4"/><line x1="23" y1="23" x2="29" y2="23"/><line x1="13" y1="31" x2="19" y2="31"/>',
    home: '<path d="M5 21 L21 7 L37 21" stroke-linejoin="round"/><path d="M10 18 V35 H32 V18" stroke-linejoin="round"/><rect x="18" y="25" width="6" height="10"/>',
    ruler: '<rect x="4" y="15" width="34" height="12" rx="1.5"/><line x1="10" y1="15" x2="10" y2="21"/><line x1="16" y1="15" x2="16" y2="23"/><line x1="22" y1="15" x2="22" y2="21"/><line x1="28" y1="15" x2="28" y2="23"/><line x1="34" y1="15" x2="34" y2="21"/>'
  };

  function iconSvg(key) {
    return '<svg class="icon" viewBox="0 0 42 42" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">' + (ICONS[key] || ICONS.doc) + '</svg>';
  }

  function scalePreview() {
    const wrap = document.getElementById('previewFrameWrap');
    document.getElementById('previewScale').style.transform = 'scale(' + (wrap.clientWidth / BASE_W) + ')';
  }
  window.addEventListener('resize', scalePreview);
  scalePreview();

  let selected = null;
  const openBtn = document.getElementById('openBtn');
  openBtn.onclick = function () {
    if (selected) window.open(selected.url, '_blank', 'noopener');
  };

  function selectTool(t, card) {
    selected = t;
    document.querySelectorAll('.card.tool').forEach(function (c) { c.classList.remove('active'); });
    card.classList.add('active');
    document.getElementById('previewFrame').src = t.url;
    document.getElementById('previewTitle').textContent = t.name;
    document.getElementById('previewEmpty').style.display = 'none';
    openBtn.disabled = false;
  }

  const box = document.getElementById('tools');
  TOOLS.forEach(function (t) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card tool';

    const top = document.createElement('div');
    top.className = 'card-top';
    const wrap = document.createElement('div');
    wrap.innerHTML = iconSvg(t.icon);
    top.appendChild(wrap.firstChild);
    const h2 = document.createElement('h2');
    h2.textContent = t.name;
    top.appendChild(h2);
    card.appendChild(top);

    const p = document.createElement('p');
    p.textContent = t.desc;
    card.appendChild(p);

    card.addEventListener('click', function () { selectTool(t, card); });
    box.appendChild(card);
  });

  const slots = Math.max(MIN_SLOTS, Math.ceil(TOOLS.length / 2) * 2);
  for (let i = TOOLS.length; i < slots; i++) {
    const d = document.createElement('div');
    d.className = 'card placeholder';
    box.appendChild(d);
  }
</script>

</body>
</html>
